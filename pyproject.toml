[project]
name = "pr-watcher"
version = "0.1.0"
description = "Vigilante de PRs de Bitbucket que solo despierta a Claude cuando hay trabajo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=0.80"]

[project.scripts]
prwatch = "prwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prwatch"]
